name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: slamdunk_test
          POSTGRES_USER: slamdunk_test
          POSTGRES_PASSWORD: slamdunk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slamdunk_test -d slamdunk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://slamdunk_test:slamdunk_test@localhost:5432/slamdunk_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm test
